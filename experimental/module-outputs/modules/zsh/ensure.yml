---
- name: Install Zsh using the substrate package manager
  ansible.builtin.package:
    name: zsh
    state: present

- name: Resolve the executable on the target, not the controller
  ansible.builtin.shell: command -v zsh
  register: shell_probe
  changed_when: false

- name: Inspect the actual login-shell executable
  ansible.builtin.stat:
    path: '{{ shell_probe.stdout }}'
    follow: true
  register: shell_file

- name: Read registered login shells
  ansible.builtin.slurp:
    src: /etc/shells
  register: login_shells

- name: Verify path is absolute, executable and registered as a login shell
  ansible.builtin.assert:
    that:
      - shell_probe.stdout is match('^/')
      - shell_file.stat.isreg | default(false)
      - shell_file.stat.executable | default(false)
      - shell_probe.stdout in (login_shells.content | b64decode).splitlines()

- name: Publish only the verified result for this bound instance
  ansible.builtin.set_fact:
    deployment_results: "{{ (deployment_results | default({})) | combine({module_result_key: {'path': shell_probe.stdout}}) }}"
