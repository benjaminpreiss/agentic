---
# account_name is instance configuration; shell_path comes from a bound login-shell.
- name: Validate local account name
  ansible.builtin.assert:
    that: account_name is match('^[a-z][a-z0-9-]*$')

- name: Inspect any pre-existing local account
  ansible.builtin.getent:
    database: passwd
    key: '{{ account_name }}'
    fail_key: false

- name: Refuse silent migration of an existing account to a different shell
  ansible.builtin.assert:
    that: (ansible_facts.getent_passwd | default({})).get(account_name) is none or ansible_facts.getent_passwd[account_name][5] == shell_path
    fail_msg: 'Existing account uses another shell; an explicit migration is required.'

- name: Ensure unprivileged local account with supplied login shell
  ansible.builtin.user:
    name: '{{ account_name }}'
    shell: '{{ shell_path }}'
    create_home: true
    # Do not rewrite supplementary groups of an existing account.

- name: Check the account's configured shell
  ansible.builtin.getent:
    database: passwd
    key: '{{ account_name }}'

- name: Check the account was not granted administrator groups
  ansible.builtin.command:
    argv: [id, -nG, '{{ account_name }}']
  register: account_groups
  changed_when: false

- name: Verify resulting account state
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[account_name][5] == shell_path
      - "'wheel' not in account_groups.stdout.split()"
      - "'sudo' not in account_groups.stdout.split()"
