---
- name: Verify fresh Tumbleweed substrate
  ansible.builtin.command:
    argv: [grep, -Eq, '^ID="?opensuse-tumbleweed"?$', /etc/os-release]
  register: distro_check
  changed_when: false
  failed_when: distro_check.rc != 0

- name: Require explicitly confirmed disposable VM with console access
  ansible.builtin.assert:
    that:
      - agentic_disposable_vm | default(false) | bool
      - agentic_console_verified | default(false) | bool
    fail_msg: 'Use only a disposable Tumbleweed VM after verifying console access.'

- name: Inspect Tumbleweed login-shell registry
  ansible.builtin.stat:
    path: /etc/shells
  register: shell_registry

- name: Require a readable login-shell registry
  ansible.builtin.assert:
    that:
      - shell_registry.stat.isreg | default(false)
      - shell_registry.stat.readable | default(false)

- name: Verify NSS local account lookup is available
  ansible.builtin.command:
    argv: [getent, passwd, root]
  changed_when: false

- name: Verify the Tumbleweed package manager is available
  ansible.builtin.command:
    argv: [zypper, --version]
  changed_when: false
